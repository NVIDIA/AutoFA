name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pull-request code runs later; keep the token out of its Git config.
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          python-version: "3.12"

      - name: Configure test harness probe
        id: setup
        shell: bash
        run: |
          harness_bin="$RUNNER_TEMP/autofa-ci-bin"
          mkdir -p "$harness_bin"
          cat > "$harness_bin/codex" <<'EOF'
          #!/bin/sh
          [ "$*" = "login status" ] || exit 99
          exit 0
          EOF
          chmod +x "$harness_bin/codex"
          echo "AUTOFA_CODEX_CLI=$harness_bin/codex" >> "$GITHUB_ENV"
          echo "AUTOFA_HOME=$RUNNER_TEMP/autofa-home" >> "$GITHUB_ENV"

      # AutoFA installs no PyAV or FFmpeg. The audio and video tests use PyAV compiled against
      # the FFmpeg that tools/build_ffmpeg.sh builds, never a PyPI wheel with bundled codecs.
      # Later `uv run` steps keep this PyAV: they do not remove undeclared packages.
      - name: Build FFmpeg and PyAV for the audio and video tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkg-config zlib1g-dev \
            libdav1d-dev libvpx-dev libopus-dev libvorbis-dev
          prefix="$RUNNER_TEMP/ffmpeg"
          tools/build_ffmpeg.sh "$prefix"
          uv sync --python 3.12 --extra dev
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig" LDFLAGS="-Wl,-rpath,$prefix/lib" \
            uv pip install --python .venv/bin/python --no-binary av --no-cache "av==19.0.2"
          # The documented build's codecs, exactly; review any change with the build script.
          uv run --python 3.12 --extra dev python - <<'EOF'
          import av
          documented = {
              "libdav1d", "libvpx", "libvpx-vp9", "theora", "vp3", "libopus", "libvorbis",
              "flac", "pcm_u8", "pcm_s8", "pcm_s16le", "pcm_s16be", "pcm_s24le", "pcm_s24be",
              "pcm_s32le", "pcm_s32be", "pcm_s64le", "pcm_f32le", "pcm_f32be", "pcm_f64le",
              "pcm_f64be",
          }
          built = set(av.codecs_available)
          print("PyAV", av.__version__, "codecs:", ", ".join(sorted(built)))
          assert built == documented, (sorted(built - documented), sorted(documented - built))
          EOF

      # Each gate runs even when an earlier one fails, so one push reports every finding.
      # See "Quality gates" in CONTRIBUTING.md for what each ratchet allows.
      - name: Ruff (full tree, including complexity)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --python 3.12 --extra dev ruff check --output-format github .

      - name: Layering contracts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --python 3.12 --extra dev python tools/check_layering.py

      - name: Pyright type check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --python 3.12 --extra dev python tools/check_types.py

      - name: Pre-commit hooks (file hygiene and secrets)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          # The steps above and the compliance workflow already run these hooks' checks.
          SKIP: ruff,layering,license-headers
        run: uv run --python 3.12 --extra dev pre-commit run --all-files --show-diff-on-failure

      - name: Install driver compatibility interpreter
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          uv python install 3.9
          echo "AUTOFA_DRIVER_TEST_PYTHON39=$(uv python find 3.9)" >> "$GITHUB_ENV"

      - name: Run tests with coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run --python 3.12 --extra dev python -m pytest -n auto --cov --cov-report=term

      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        shell: bash
        run: |
          # Report the total even below the floor; the test step enforces fail_under.
          total="$(uv run --python 3.12 --extra dev coverage report --format=total --precision=1 \
            --fail-under=0)"
          floor="$(uv run --python 3.12 --extra dev python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["coverage"]["report"]["fail_under"])')"
          echo "Statement coverage: ${total}% (floor ${floor}%)" >> "$GITHUB_STEP_SUMMARY"
