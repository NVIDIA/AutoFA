name: Feature request
description: Propose an AutoFA improvement with a concrete use case.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Read CONTRIBUTING.md at the repository root before submitting.
        Use synthetic examples and omit confidential information.
        Report suspected vulnerabilities through the private channels in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the task you are trying to complete and the current limitation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Give one concrete example of what a user should be able to do and the result they should see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Describe workarounds you considered and any compatibility, data-format, or model-provider constraints.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this proposal.
          required: true
        - label: This proposal contains only information I am authorized to share.
          required: true
