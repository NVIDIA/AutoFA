# Workflows pin each action to a commit SHA; Dependabot proposes updates to those pins
# and their version comments. Python dependencies have no lockfile and are not covered.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
