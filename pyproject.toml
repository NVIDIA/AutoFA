"src/evalrdl_readers/core/input.py" = ["E402", "E501"]
"src/evalrdl_readers/core/reader.py" = ["E501"]
"src/evalrdl_readers/readers/bundle_converter/__init__.py" = ["E501"]
"src/evalrdl_readers/readers/bundle_converter/declare.py" = ["E501"]
"src/evalrdl_readers/readers/bundle_converter/landmarks.py" = ["E501"]
"src/evalrdl_readers/readers/codex/declare.py" = ["E501"]
