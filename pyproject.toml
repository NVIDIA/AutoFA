[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autofa"
version = "0.1.0"
description = "AutoFA — automated failure discovery from eval parquet logs"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-4.0 AND Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "CONTRIBUTING.md",
  "THIRD_PARTY_NOTICES.md",
  "third_party/evalrdl/README.md",
  "third_party/dependency-notices.json",
  "third_party/NATIVE_BINARY_REVIEW.md",
  "third_party/licenses/**/*",
]
authors = [{ name = "AutoFA" }]
dependencies = [
  "numpy>=1.26",
  "pyarrow>=15",
  "polars>=2.0,<3",
  "PyYAML>=6",
  "rich>=13.7",
  "pygments>=2.17",
  "prompt-toolkit>=3.0",
  "claude-agent-sdk>=0.2.160",
  "openai>=1.45",
  "regex",
  "keyring>=25.7.0",
  "tomlkit>=0.13",
  "ijson>=3.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "Pillow>=10",
  "pypdfium2>=4.30,<6",
  "av>=14",
]

[project.optional-dependencies]
# The quality gates pin their linters: a new release can add findings without a code change.
dev = [
  "pytest>=8",
  "pytest-xdist>=3.5",
  "pytest-cov>=7.1",
  "coverage>=7.9",
  "ruff==0.17.4",
  "pyright==1.1.414",
  "httpx>=0.27",
  "pre-commit>=4.0",
  # Pinned: new releases change detection plugins and the .secrets.baseline format.
  "detect-secrets==1.5.0",
]
audio = ["faster-whisper>=1.1,<2"]

[project.scripts]
autofa = "autofa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autofa = ["py.typed", "defaults.toml", "estimate_baselines.json", "taxonomy/versions/*.json", "skills/*/*.md", "preflight/*/*.md"]
autofa_library_server = ["templates/*.html", "static/*.js", "static/*.css"]
evalrdl_trace = ["static/*"]
evalrdl_readers = ["core/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
# sys.monitoring keeps the line-coverage overhead of the parallel suite small on Python 3.12.
core = "sysmon"
# The vendored evalrdl packages are tested in the EvalRDL repository, which exports them here.
omit = ["src/evalrdl_*/*"]

[tool.coverage.report]
precision = 1
skip_covered = true
# Ratchet: statement coverage of src when the gate was added (CI and local runs). Raise it
# when coverage rises; never lower it.
fail_under = 87.9

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party/licenses"]

[tool.ruff.lint]
# C901 and RUF100 are ratchets: see "Quality gates" in CONTRIBUTING.md.
select = ["E", "F", "I", "UP", "B", "C90", "RUF100"]
# Rules that are not enabled but whose `# noqa` comments document intent. Listing them keeps
# RUF100 from reporting those comments as unused.
external = ["A003", "ANN", "BLE001", "N802", "SLF001"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# Ratchet: files with lines over 100 characters today, mostly embedded HTML/JS templates and the
# bundled evalrdl snapshot. Do not add files. Remove an entry once its file is clean;
# tests/test_quality_gates.py fails while an entry suppresses nothing.
"src/autofa/data/evalrdl_efficiency.py" = ["E501"]
"src/autofa/preflight/cheating/report.py" = ["E501"]
"src/autofa/reports/efficiency_card.py" = ["E501"]
"src/autofa/reports/failure_cards.py" = ["E501"]
"src/evalrdl_export/autofa.py" = ["E501"]
