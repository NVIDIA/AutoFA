"src/evalrdl_readers/readers/harbor/translate.py" = ["E501"]
"src/evalrdl_readers/readers/mounts.py" = ["E501"]
"src/evalrdl_readers/readers/nemo_evaluator/declare.py" = ["E501"]
"src/evalrdl_readers/readers/nemo_evaluator_launcher/declare.py" = ["E501"]
"src/evalrdl_readers/readers/nemo_evaluator_launcher/traffic.py" = ["E501"]
"src/evalrdl_readers/readers/nemo_skills/declare.py" = ["E501"]
"src/evalrdl_readers/readers/nemo_skills/translate.py" = ["E501"]
"src/evalrdl_readers/readers/pi/declare.py" = ["E501"]
"src/evalrdl_readers/readers/store_schema.py" = ["E501"]
"src/evalrdl_schema/backends.py" = ["E501"]
"src/evalrdl_schema/v11/__init__.py" = ["E501"]
"src/evalrdl_schema/v12/__init__.py" = ["E501"]
"src/evalrdl_trace/conformance.py" = ["E501"]
"tests/vendor/test_evalrdl_trace_prompts.py" = ["E501"]
"tests/vendor/test_evalrdl_trace_trace.py" = ["E501"]

[tool.ruff.lint.isort]
# Shared test fixtures and helpers live in tests/support and are imported as `support.*`.
known-local-folder = ["support"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
# Fixed so a macOS checkout and Linux CI report the same errors.
pythonPlatform = "Linux"
typeCheckingMode = "basic"
# Ratchet: files with type errors when the check was added. New files are checked. Do not add
# files; remove an entry once its file passes (tools/check_types.py fails while it does).
