<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="title desc">
  <title id="title">AutoFA overview</title>
  <desc id="desc">Evaluation runs from NeMo Gym, Harbor or EvalRDL first pass optional preflight cheating checks. Two complementary workflows then run in parallel: bottom-up failure discovery, which can include efficiency metrics, and top-down taxonomy classification. Results land in a browsable failure library. A coding agent with the autofa-driver skill can configure, launch and monitor every workflow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#656d76"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5e9400"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #656d76; }
    .t { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; fill: #424a53; }
    .m { font-size: 12.5px; fill: #656d76; }
    .q { font-size: 13.5px; font-style: italic; }
    .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #656d76; }
    .wire { fill: none; stroke: #656d76; stroke-width: 1.5; stroke-linejoin: round; }
  </style>

  <rect x="0.5" y="0.5" width="999" height="519" rx="18" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Driver band -->
  <rect x="40" y="24" width="920" height="64" rx="12" fill="#f6f8fa" stroke="#5e9400" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="62" y="51" class="t" style="font-size:16px">Your coding agent <tspan fill="#5e9400">+ autofa-driver</tspan></text>
  <text x="62" y="72" class="m">Claude Code or Codex, in plain language</text>
  <text x="938" y="51" class="s" text-anchor="end">set goal → choose models → launch → monitor → explain</text>
  <text x="938" y="72" class="m" text-anchor="end">every workflow also runs from the CLI or a YAML batch config</text>
  <line x1="535" y1="96" x2="535" y2="112" stroke="#5e9400" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>

  <!-- Inputs -->
  <rect x="40" y="120" width="136" height="340" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="54" y="146" class="h" style="font-size:10.5px;letter-spacing:0.6px">EVALUATION RUNS</text>
  <rect x="54" y="164" width="108" height="56" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="68" y="188" class="t" style="font-size:15px">NeMo Gym</text>
  <text x="68" y="207" class="m">local folder</text>
  <rect x="54" y="232" width="108" height="56" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="68" y="256" class="t" style="font-size:15px">Harbor</text>
  <text x="68" y="275" class="m">local folder</text>
  <rect x="54" y="300" width="108" height="56" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="68" y="324" class="t" style="font-size:15px">EvalRDL</text>
  <text x="68" y="343" class="m">remote run</text>
  <text x="56" y="400" class="m">Traces, rewards</text>
  <text x="56" y="418" class="m">and grader</text>
  <text x="56" y="436" class="m">evidence</text>

  <line x1="182" y1="290" x2="198" y2="290" class="wire" marker-end="url(#arrow)"/>

  <!-- Preflight (runs first) -->
  <rect x="204" y="120" width="115" height="340" rx="12" fill="#f6f8fa" stroke="#b07a00" stroke-width="1.5"/>
  <text x="219" y="148" class="tag" style="fill:#b07a00">STEP 0</text>
  <text x="219" y="172" class="t" style="font-size:15px">Preflight</text>
  <text x="219" y="194" class="s">Cheating check</text>
  <text x="219" y="236" class="m">Flags rollouts</text>
  <text x="219" y="254" class="m">that gamed</text>
  <text x="219" y="272" class="m">the evaluation,</text>
  <text x="219" y="290" class="m">e.g. by editing</text>
  <text x="219" y="308" class="m">the tests</text>
  <text x="219" y="430" class="m">optional,</text>
  <text x="219" y="447" class="m">runs first</text>

  <!-- Fork into the two parallel lanes -->
  <line x1="325" y1="290" x2="334" y2="290" class="wire"/>
  <path d="M334,290 V213 Q334,205 342,205 H344" class="wire" marker-end="url(#arrow)"/>
  <path d="M334,290 V387 Q334,395 342,395 H344" class="wire" marker-end="url(#arrow)"/>

  <!-- Discovery lane, with efficiency as part of it -->
  <rect x="352" y="120" width="368" height="170" rx="12" fill="#f6f8fa" stroke="#5e9400" stroke-width="1.5"/>
  <text x="370" y="144" class="tag" style="fill:#5e9400">BOTTOM-UP</text>
  <text x="370" y="167" class="t">Failure discovery</text>
  <text x="370" y="188" class="q" style="fill:#5e9400">“What keeps going wrong?”</text>
  <text x="370" y="210" class="s">An agent mines traces for recurring mechanisms</text>
  <text x="370" y="228" class="s">and writes reusable Python detectors</text>
  <rect x="368" y="238" width="336" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="368" y="246" width="3" height="24" rx="1.5" fill="#8250df"/>
  <text x="382" y="255" class="t" style="font-size:13.5px">+ Efficiency metrics</text>
  <text x="382" y="271" class="m" style="font-size:12px">tokens · context · turns · tools · cost</text>
  <text x="692" y="255" class="tag" text-anchor="end" style="fill:#8250df">OPTIONAL</text>

  <!-- Parallel badge, centred in the gap between the lanes -->
  <rect x="436" y="299" width="200" height="22" rx="11" fill="#ffffff" stroke="#8c959f" stroke-width="1"/>
  <text x="536" y="314.5" text-anchor="middle" style="font-size:11.5px;font-weight:600;fill:#424a53">parallel · complementary</text>

  <!-- Taxonomy lane -->
  <rect x="352" y="330" width="368" height="130" rx="12" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="370" y="354" class="tag" style="fill:#0969da">TOP-DOWN</text>
  <text x="370" y="377" class="t">Taxonomy classification</text>
  <text x="370" y="398" class="q" style="fill:#0969da">“Which known mode is it?”</text>
  <text x="370" y="420" class="s">A judge assigns each failure one mode,</text>
  <text x="370" y="438" class="s">separating model from harness faults</text>

  <!-- Lanes to library -->
  <line x1="726" y1="205" x2="762" y2="205" class="wire" marker-end="url(#arrow)"/>
  <line x1="726" y1="395" x2="762" y2="395" class="wire" marker-end="url(#arrow)"/>

  <!-- Library -->
  <rect x="770" y="120" width="190" height="340" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="788" y="146" class="h">FAILURE LIBRARY</text>
  <circle cx="794" cy="181" r="4" fill="#5e9400"/>
  <text x="806" y="185" class="s">Failure cards</text>
  <circle cx="794" cy="219" r="4" fill="#5e9400"/>
  <text x="806" y="223" class="s">Source traces with</text>
  <text x="806" y="241" class="s">highlighted evidence</text>
  <circle cx="794" cy="275" r="4" fill="#5e9400"/>
  <text x="806" y="279" class="s">HTML reports</text>
  <circle cx="794" cy="313" r="4" fill="#5e9400"/>
  <text x="806" y="317" class="s">Publish and reuse</text>
  <text x="806" y="335" class="s">detectors across runs</text>
  <text x="788" y="412" class="mono">127.0.0.1:8765</text>
  <text x="788" y="432" class="mono">~/.autofa/</text>

  <text x="500" y="500" class="m" text-anchor="middle">Bring your own models: Claude Code or Codex for agents, any OpenAI-compatible endpoint for LLM judges and detectors</text>
</svg>
